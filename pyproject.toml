[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clima-pipeline"
version = "0.1.0"
description = "Pipeline de dados climáticos (Open-Meteo -> pandas -> SQLite -> FastAPI -> Streamlit)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.30",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
notebooks = [
    "seaborn>=0.13",
    "polars>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
